# Gitleaks configuration — one file, six repositories, identical in each.
#
# It extends the default rule set and weakens nothing in it. There is no broad
# path allowlist here on purpose: an allowlist covering "tests/" is how a live key
# gets shipped inside a test fixture, and the fixtures that legitimately contain a
# fake key already say so on the line itself:
#
#     const KEY = 'sk-live-not-a-real-key'; // gitleaks:allow
#
# Use that comment for a deliberate fake. Never for a real one: rotate it instead.

[extend]
useDefault = true

[allowlist]
description = "Non-live example credentials, documented in prose"
# One documentation file quotes a request whose bearer token is the literal
# placeholder "sk-invalid", as the reproduction of a 401. The path is allowlisted
# rather than the content, and it is the only path allowlisted.
paths = [
  '''docs/flaws\.md''',
]
