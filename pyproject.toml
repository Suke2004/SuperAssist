[project]
name = "veyracue"
version = "1.1.0"
description = "Local desktop interview assistant for Windows, macOS, and Linux"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.2",
    "deepgram-sdk==3.*",
    "fastapi>=0.110",
    "httpx>=0.27",
    "mss>=10,<11 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "openai>=1.30",
    "orjson>=3.10",
    "pyaudiowpatch>=0.2.12.7,<0.3 ; sys_platform == 'win32'",
    "pydantic-settings>=2.2",
    "pynput>=1.7.6",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "python-dotenv>=1.0",
    "pywebview>=5.0 ; sys_platform != 'linux'",
    "pywebview[qt]>=6.0 ; sys_platform == 'linux'",
    "pywin32>=312 ; sys_platform == 'win32'",
    "soundcard>=0.4.6,<0.5 ; sys_platform == 'darwin' or sys_platform == 'linux'",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "numpy>=1.24",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
